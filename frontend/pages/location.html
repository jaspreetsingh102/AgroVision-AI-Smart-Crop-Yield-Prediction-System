<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Farmer - Set Location</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/location.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <button id="backBtn" class="btn-back">
        <i class="fas fa-arrow-left"></i>
      </button>
      <div class="header-title">📍 Set Location</div>
      <p class="header-subtitle">Precise location = Better AI predictions</p>
    </header>

    <main class="main-card">
      <div class="info-box">
        <i class="fas fa-info-circle"></i>
        Location helps predict local weather, soil types & crop performance
      </div>

      <button id="autoLocateBtn" class="btn-auto btn-hero">
        <i class="fas fa-location-arrow"></i> 
        Use My Current Location
      </button>

      <div class="or-divider">
        <span>or enter manually</span>
      </div>

      <form id="locationForm">
        <div class="input-group">
          <select id="country" required>
            <option value="">Select Country</option>
            <option value="India">India 🇮🇳</option>
          </select>
          <label>Country</label>
        </div>

        <div class="input-group">
          <select id="state" required disabled>
            <option value="">Select State</option>
          </select>
          <label>State</label>
        </div>

        <div class="input-group">
          <input type="text" id="district" placeholder=" " required>
          <label>District</label>
        </div>

        <button type="submit" class="btn-primary">
          <i class="fas fa-map-marker-alt"></i> Save Location
        </button>
      </form>

      <div id="locationResult" class="location-result" style="display: none;">
        <div class="success-icon">📍</div>
        <p id="detectedLocation">Your location will appear here</p>
        <button id="confirmLocation" class="btn-confirm btn-primary">Confirm & Continue</button>
      </div>
    </main>

    <footer class="app-footer">
      <p>AI Farmer • Location Services</p>
    </footer>
  </div>

  <script src="../scripts/location.js"></script>
</body>
</html>
