<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Farmer - Farm Details</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/farm-details.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <button id="backBtn" class="btn-back">
        <i class="fas fa-arrow-left"></i>
      </button>
      <div class="header-title">🌾 Farm Setup</div>
      <p class="header-subtitle">3 quick steps for personalized recommendations</p>
    </header>

    <main class="main-card">
      <div id="farmWizard" class="wizard-container">
        <!-- Progress Bar -->
        <div class="progress-bar">
          <div class="progress-step active"></div>
          <div class="progress-step"></div>
          <div class="progress-step"></div>
        </div>

        <!-- Step 1: Personal Details -->
        <div id="step1" class="wizard-step active">
          <h3>Step 1: Personal Profile</h3>

          <div class="input-group">
            <select id="farmerGender" required>
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
            <label>Gender</label>
          </div>

          <div class="input-group">
            <input type="text" id="farmerVillage" placeholder=" " required>
            <label>Village / District</label>
          </div>

          <div class="input-group">
            <input type="number" id="farmerAge" min="15" max="100" placeholder=" " required>
            <label>Age</label>
          </div>

          <div class="input-group">
            <select id="farmerEducation" required>
              <option value="">Education Level</option>
              <option value="Primary">Primary School</option>
              <option value="Secondary">Secondary School</option>
              <option value="Graduate">Graduate / Degree</option>
              <option value="Other">Other</option>
            </select>
            <label>Education</label>
          </div>

          <div class="input-group">
            <input type="tel" id="farmerPhone" placeholder=" " required>
            <label>Contact Number</label>
          </div>

          <div class="input-group">
            <input type="number" id="farmerExperience" min="0" placeholder=" " required>
            <label>Years of Experience</label>
          </div>

          <div class="input-group">
            <input type="number" id="farmerFamily" min="1" placeholder=" " required>
            <label>Family Members Farming</label>
          </div>
        </div>

        <!-- Step 2: Farm Profile -->
        <div id="step2" class="wizard-step">
          <h3>Step 2: Farm Basics</h3>

          <div class="input-group">
            <input type="number" id="farmSize" min="0.1" step="0.1" placeholder=" " required>
            <label>Total Farm Size (Acres)</label>
          </div>

          <div class="input-group">
            <select id="farmGoal" required>
              <option value="">Farming Goal</option>
              <option value="Profit">Maximize Profit</option>
              <option value="Sustainability">Sustainability</option>
              <option value="Subsistence">Family Needs</option>
              <option value="Export">Export Quality</option>
            </select>
            <label>Primary Goal</label>
          </div>

          <p class="section-label">Current / Planned Crops (multi-select)</p>
          <div class="crops-selector">
            <input type="text" id="cropsSearch" placeholder="Search crops...">
            <div id="cropsContainer">
              <!-- Dynamic crops -->
            </div>
          </div>
        </div>

        <!-- Step 3: Past Performance -->
        <div id="step3" class="wizard-step">
          <h3>Step 3: Past Performance</h3>
          <p class="info-box">Add previous years data (at least 2 years recommended)</p>
          
          <div id="areaHistoryContainer">
            <!-- Dynamic rows -->
          </div>
          
          <button type="button" id="addAreaRow" class="btn-primary">
            <i class="fas fa-plus"></i> Add Year
          </button>
        </div>

        <!-- Shared Navigation -->
        <div class="wizard-nav">
          <button type="button" id="prevBtn" class="btn-nav btn-prev" style="display: none;">Previous</button>
          <button type="button" id="nextBtn" class="btn-nav btn-next">Next</button>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <p>Powered by AI Precision Farming</p>
    </footer>
  </div>

  <script src="../scripts/farm-details.js"></script>
</body>
</html>
