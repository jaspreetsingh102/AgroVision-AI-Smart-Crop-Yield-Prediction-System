<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Farmer - Authentication</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/login.css">
</head>
<body class="login-page">
  <div class="container">
    <header class="app-header">
      <div class="header-title">🌾 AI Farmer</div>
      <p class="header-subtitle">Welcome to Precision Farming</p>
    </header>

    <main class="main-card" style="max-width: 420px; margin: 0 auto;">
      
      <!-- Single Page Design - Tabs Style -->
      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
        <button class="tab-btn" data-tab="signup">
          <i class="fas fa-user-plus"></i> Sign Up
        </button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form active">
        <div class="input-group">
          <input type="email" id="loginEmail" placeholder=" " required>
          <label>Email Address</label>
        </div>
        <div class="input-group">
          <input type="password" id="loginPassword" placeholder=" " required>
          <label>Password</label>
        </div>
        <button type="submit" class="btn-primary btn-hero">
          <i class="fas fa-arrow-right"></i> Sign In
        </button>
        <div style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.875rem;">
          Use: demo@farmer.com / demo123
        </div>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" class="auth-form">
        <div class="input-group">
          <input type="text" id="signupName" placeholder=" " required>
          <label>Full Name</label>
        </div>
        <div class="input-group">
          <input type="email" id="signupEmail" placeholder=" " required>
          <label>Email Address</label>
        </div>
        <div class="input-group">
          <input type="password" id="signupPassword" placeholder=" " required>
          <label>Password (min 6 chars)</label>
        </div>
        <button type="submit" class="btn-primary btn-hero">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </form>

      <!-- Guest Quick Access -->
      <div class="guest-section">
        <div class="divider-line"></div>
        <button id="guestBtn" class="btn-guest">
          <i class="fas fa-rocket"></i> Continue as Guest (Demo)
        </button>
      </div>
    </main>

    <footer class="app-footer">
      <p>AI Farmer • Smart Crop Recommendations © 2024</p>
    </footer>
  </div>

  <script src="../scripts/login.js"></script>
</body>
</html>
