<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Manage Orders — AgroMarket</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .status-select {
      padding: 5px;
      border-radius: 4px;
      background: #020617;
      color: white;
      border: 1px solid #334155;
    }

    .order-details {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
</head>

<body>

  <div class="dashboard">
    <aside class="sidebar">
      <h2>🌱 AgroMarket</h2>
      <ul>
        <li onclick="location.href='seller-dashboard.html'" style="cursor:pointer">🏠 Dashboard</li>
        <li onclick="location.href='seller-products.html'" style="cursor:pointer">📦 Products</li>
        <li onclick="location.href='seller-orders.html'" class="active" style="cursor:pointer">🛒 Orders</li>
        <li onclick="location.href='seller-analytics.html'" style="cursor:pointer">📊 Analytics</li>
        <li onclick="location.href='seller-profile.html'" style="cursor:pointer">👤 Profile</li>
        <li onclick="handleLogout()" style="cursor:pointer; color: #ff4d4d; margin-top: auto;">🚪 Logout</li>
      </ul>
    </aside>

    <main class="main">
      <header>
        <h1>Customer Orders</h1>
      </header>

      <section class="table-section">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Total Amount</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody">
            <tr>
              <td colspan="6">Loading orders...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/seller-orders.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          })
          .catch(error => {
            console.log('ServiceWorker registration failed: ', error);
          });
      });
    }
  </script>
</body>

</html>
